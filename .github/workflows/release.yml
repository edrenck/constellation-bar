name: Signed release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    environment: distribution
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Check version and clean checkout
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain)"
      - run: python3 scripts/tests/test_release.py
      - run: swift test
      - run: node --test extensions/browser-media/content.test.cjs
      - name: Import distribution credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing Developer ID certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${NOTARY_KEY_BASE64:?Missing notarization API key}"
          : "${NOTARY_KEY_ID:?Missing notarization key ID}"
          : "${NOTARY_ISSUER_ID:?Missing notarization issuer ID}"
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/constellation-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials constellation-release --keychain "$KEYCHAIN_PATH" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
      - name: Sign, notarize and verify
        env:
          CONSTELLATION_SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
          CONSTELLATION_NOTARY_PROFILE: constellation-release
          CONSTELLATION_NOTARY_KEYCHAIN: ${{ runner.temp }}/constellation-signing.keychain-db
        run: ./scripts/release.sh
      - name: Create draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" ".build/distribution/ConstellationBar-$(cat VERSION)-universal.zip" .build/distribution/SHA256SUMS --verify-tag --draft --prerelease --title "ConstellationBar $RELEASE_TAG Alpha" --notes 'Developer ID signed, notarized and stapled universal build. Complete the documented clean-install and hardware checks before publishing.'
      - name: Retain notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-diagnostics
          path: .build/notarization-report.*/
          if-no-files-found: ignore
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/constellation-signing.keychain-db" || true
