name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun swift --version
      - run: python3 scripts/tests/test_release.py
      - run: python3 scripts/tests/test_build_gates.py
      - run: swift test
      - run: ./scripts/build-app.sh --universal
      - name: Verify and archive development build
        run: |
          lipo .build/ConstellationBar.app/Contents/MacOS/ConstellationBar -verify_arch arm64 x86_64
          codesign --verify --strict .build/ConstellationBar.app
          ditto -c -k --sequesterRsrc --keepParent .build/ConstellationBar.app .build/ConstellationBar-development.zip
      - name: Retain native UI journey logs and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-journeys
          path: .build/ui-journeys/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ConstellationBar-development
          path: .build/ConstellationBar-development.zip
