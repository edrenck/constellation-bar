name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build-app.sh --universal
      - run: lipo -info .build/ConstellationBar.app/Contents/MacOS/ConstellationBar
      - uses: actions/upload-artifact@v4
        with:
          name: ConstellationBar-${{ matrix.os }}
          path: .build/ConstellationBar.app
